<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found — Soumyadeep Das</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="/css/styles.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◆</text></svg>" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#090c12" media="(prefers-color-scheme: dark)" />
<script>
  (function () {
    try {
      var s = localStorage.getItem('theme');
      var d = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', s || (d ? 'dark' : 'light'));
    } catch (e) {}
  })();
</script>
<style>
  .nf{ min-height:100vh; display:grid; place-items:center; text-align:center; padding:40px 24px; position:relative; overflow:hidden; }
  .nf__code{ font-size:clamp(5rem,18vw,11rem); font-weight:700; letter-spacing:-.05em; line-height:1;
             background:linear-gradient(135deg,var(--accent),#a855f7); -webkit-background-clip:text;
             background-clip:text; color:transparent; }
  .nf h1{ font-size:clamp(1.4rem,4vw,2.1rem); margin:14px 0 12px; }
  .nf p{ max-width:44ch; margin:0 auto 30px; }
  .nf__actions{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
</style>
</head>
<body>
<main class="nf">
  <div class="hero__bg" aria-hidden="true">
    <div class="blob blob--1"></div>
    <div class="blob blob--2"></div>
    <div class="grid-lines"></div>
  </div>
  <div style="position:relative;z-index:1">
    <p class="nf__code">404</p>
    <h1>This page drifted off into space.</h1>
    <p>The link may be broken, or the page moved. Let's get you back to something that exists.</p>
    <div class="nf__actions">
      <a href="/" class="btn btn--primary">Back home</a>
      <a href="/#work" class="btn btn--ghost">See my projects →</a>
    </div>
  </div>
</main>
</body>
</html>
