<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Not found — Soumyadeep Das</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/styles.css" />
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'dark')}catch(e){}</script>
<style>
  .lost{ min-height:100svh; display:flex; flex-direction:column; justify-content:center;
         max-width:1240px; margin:0 auto; padding:0 var(--gut); }
  .lost h1{ font-family:var(--serif); font-size:clamp(60px,14vw,180px); line-height:.85;
            font-weight:400; letter-spacing:-.03em; margin-bottom:26px; }
  .lost h1 em{ font-style:italic; color:var(--accent); }
  .lost p{ color:var(--fg-dim); max-width:44ch; margin-bottom:34px; font-size:16px; line-height:1.7; }
  .lost a{ font-family:var(--mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase;
           border-bottom:1px solid var(--fg-faint); padding-bottom:4px; transition:color .3s,border-color .3s; }
  .lost a:hover{ color:var(--accent); border-color:var(--accent); }
</style>
</head>
<body>
<main class="lost">
  <h1>Four<br /><em>oh four</em></h1>
  <p>That page isn\'t here. It may have moved, or the link was wrong. Everything worth seeing is on the front page.</p>
  <p><a href="/">← Back to the start</a></p>

</body>
