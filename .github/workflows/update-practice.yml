name: Update practice heatmap

on:
  schedule:
    # 06:00 IST — first pass
    - cron: "30 0 * * *"
    # 09:00 IST — catch solves Codolio had not posted yet at 6am
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Codolio stats
        run: python3 scripts/fetch_codolio.py
      - name: Commit if the grid changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/practice.json
          if git diff --staged --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "chore: refresh Codolio practice stats"
          git push
